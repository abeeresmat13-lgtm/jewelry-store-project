{% extends "base.html" %}
{% block title %}Register — Lumière{% endblock %}
{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">◆ Lumière<span>Create your account</span></div>

        {% if error %}
        <div class="form-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.register') }}">

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-input"
                           placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input"
                           placeholder="janedoe" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input"
                       placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone (optional)</label>
                <input type="tel" name="phone" class="form-input"
                       placeholder="+1 234 567 8900">
            </div>

            <div class="form-group">
                <label class="form-label">Password (min 6 chars)</label>
                <input type="password" name="password" class="form-input"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-gold btn-full">Create Account</button>

        </form>

        <div class="auth-link">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </div>

    </div>
</div>

{% endblock %}
